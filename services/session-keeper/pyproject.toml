[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bmw-tools"
version = "0.2.0"
description = "BMW internal tool clients (Appcockpit, VPS, Octane, Codebeamer) with unified SSO authentication"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Internal BMW use only" }
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "urllib3>=1.26",
]

[project.optional-dependencies]
appcockpit = [
    "python-dateutil>=2.8",
]
octane = []
vps = []
codebeamer = []
all = [
    "python-dateutil>=2.8",
]
session-keeper = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
]
test = [
    "pytest>=7.4",
    "pytest-timeout>=2.1",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bmw_sso*", "bmw_tools*", "session_keeper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:timeout -m 'not interactive'"
markers = [
    "interactive: tests that require live login and user interaction (deselected by default)",
]
log_cli = true
log_cli_level = "WARNING"
