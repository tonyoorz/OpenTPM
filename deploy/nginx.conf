# ============================================================
#  LibreChat 生产级 Nginx 反向代理 — BMW 内网
#  Nginx 在 80 端口收请求，代理到 api 容器的 3080 端口
#  内网用 HTTP 即可；如需 HTTPS，见文件末尾注释
# ============================================================

# WebSocket / SSE 升级映射
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 限制请求体大小（文件上传）
client_max_body_size 25M;

upstream librechat_api {
    server api:3080;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/octet-stream image/svg+xml;

    # 健康检查端点（给 Nginx 自身 healthcheck 用）
    location = /health {
        proxy_pass http://librechat_api/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # API 路由
    location /api/ {
        proxy_pass http://librechat_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # SSE / 流式响应：禁用缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 其余路由（前端 SPA、静态资源等）
    location / {
        proxy_pass http://librechat_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # SSE / 流式响应：禁用缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

